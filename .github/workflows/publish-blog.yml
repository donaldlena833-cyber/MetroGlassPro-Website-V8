name: Publish Blog Drafts

on:
  schedule:
    - cron: '0 11 * * *'
  push:
    paths:
      - '_drafts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metroglass-blog-publisher
  cancel-in-progress: false

jobs:
  publish-drafts:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check for drafts
        id: check
        run: |
          if [ -d "_drafts" ] && ls _drafts/*.md 2>/dev/null | grep -q .; then
            echo "has_drafts=true" >> $GITHUB_OUTPUT
            echo "Found draft files:"
            ls -la _drafts/*.md
          else
            echo "has_drafts=false" >> $GITHUB_OUTPUT
            echo "No drafts found. Skipping."
          fi

      - name: Setup Node
        if: steps.check.outputs.has_drafts == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test publication safeguards
        if: steps.check.outputs.has_drafts == 'true'
        run: node --test tests/publish-drafts.test.mjs

      - name: Process approved, due drafts
        id: publish
        if: steps.check.outputs.has_drafts == 'true'
        run: node scripts/process-drafts.mjs

      - name: Install dependencies
        if: steps.publish.outputs.published == 'true'
        run: npm ci

      - name: Validate candidate publication
        if: steps.publish.outputs.published == 'true'
        run: |
          npm run build
          npm run check:aeo
          npm run test:aeo

      - name: Commit and push
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "MetroGlassPro Bot"
          git config user.email "operations@metroglasspro.com"
          git add -A -- app/blog app/sitemap.ts _drafts public/gallery
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git commit -m "chore: publish blog drafts $(date +'%Y-%m-%d')"
          git push
